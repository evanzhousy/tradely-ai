<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirkland House 3D Scene</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#11151b;color:#f7f2e9;font:14px system-ui,-apple-system,sans-serif}#app{height:100%;position:relative}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}.label{font:11px monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.8}.controls{position:absolute;right:20px;bottom:20px;width:min(330px,calc(100% - 40px));padding:16px;border:1px solid #ffffff26;border-radius:16px;background:#11151bcc;backdrop-filter:blur(16px);pointer-events:auto}.controls label{display:flex;justify-content:space-between;gap:12px;margin:10px 0;color:#ddd}.controls input{width:100%}.controls button{border:1px solid #ffffff30;border-radius:999px;background:#f4c95d;color:#151515;padding:9px 14px;cursor:pointer}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#11151b;color:#f4c95d;font:12px monospace;letter-spacing:.15em}.loading.hidden{display:none}.hint{color:#aaa;font-size:12px;line-height:1.5}
</style></head>
<body><div id="app"><div class="loading" id="loading">LOADING HOUSE SCENE</div><div id="viewport"></div><div class="hud"><div class="top"><span class="label">Kirkland House / 8311</span><span class="label">Three.js study</span></div><div class="controls"><div class="hint">Drag to orbit · scroll to zoom</div><label>Sun direction <output id="dirValue">38°</output></label><input id="direction" type="range" min="0" max="360" value="38"><label>Sunset <output id="sunValue">0%</output></label><input id="sunset" type="range" min="0" max="100" value="0"><button id="reset">Reset view</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/loaders/GLTFLoader.js';
const host=document.querySelector('#viewport'), direction=document.querySelector('#direction'), sunset=document.querySelector('#sunset'), reset=document.querySelector('#reset'), dirValue=document.querySelector('#dirValue'), sunValue=document.querySelector('#sunValue'), scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);camera.position.set(19,15,29);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-1.5,2.5,-2);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=65;
const sky=new THREE.HemisphereLight(0xf5f7ff,0x7b8163,1.4);scene.add(sky);const sun=new THREE.DirectionalLight(0xfff3dd,3.5);sun.position.set(8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
let house;const loader=new GLTFLoader();
loader.load('/models/kirkland-house/house.glb',g=>{house=g.scene;house.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(house);loader.load('/models/kirkland-house/birdhouse.glb',b=>{b.scene.position.set(-4.05,1.15,4);b.scene.scale.setScalar(.75);scene.add(b.scene)});document.querySelector('#loading').classList.add('hidden')},undefined,()=>{document.querySelector('#loading').textContent='HOUSE MODEL FAILED TO LOAD'});
function light(){const d=+direction.value*Math.PI/180,t=+sunset.value/100,e=(55-t*61)*Math.PI/180;sun.position.set(Math.sin(d)*Math.cos(e)*30,Math.sin(e)*30,Math.cos(d)*Math.cos(e)*30);sun.intensity=e<0?0:3.5*Math.min(1,Math.max(0,Math.sin(e))/.25);sun.color.set(0xfff3dd).lerp(new THREE.Color(0xff793c),Math.min(1,t*1.2));sky.intensity=(.22+2.18*(1-t))*.55;scene.background=new THREE.Color(0xe9e9e1).lerp(new THREE.Color(0x303c57),t);dirValue.value=direction.value+'°';sunValue.value=sunset.value+'%'}
direction.oninput=light;sunset.oninput=light;reset.onclick=()=>{camera.position.set(19,15,29);controls.target.set(-1.5,2.5,-2);controls.update();direction.value=38;sunset.value=0;light()};light();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script><script>
setTimeout(()=>{const loading=document.querySelector('#loading');if(!document.querySelector('canvas') && loading){loading.classList.remove('hidden');loading.innerHTML='<div style="text-align:center"><img src="/models/kirkland-house/preview.png" alt="Kirkland house preview" style="display:block;width:min(680px,78vw);max-height:70vh;object-fit:contain;border-radius:18px;margin-bottom:16px"><div style="font:12px monospace;letter-spacing:.12em">WEBGL PREVIEW / USE A BROWSER WITH WEBGL ENABLED FOR 3D</div></div>';loading.style.background='#11151b';}},2500);
</script></body></html>
