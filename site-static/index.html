<body><div id="app"><div class="loading" id="loading">LOADING HOUSE SCENE</div><div id="viewport"></div><div id="portalPrompt" class="portal" role="button" tabindex="0">E · 进入房屋 / Enter house</div><div class="hud"><div class="top"><span class="label">Kirkland House / 8311</span><span class="label">Three.js study</span></div><div class="controls"><button id="panelToggle" aria-label="Collapse lighting controls">−</button><div class="hint">Drag to orbit · scroll to zoom · focus scene and use WASD</div><button id="walk">Walk with avatar</button><label>Sun direction <output id="dirValue">38°</output></label><input id="direction" type="range" min="0" max="360" value="38"><label>Sunset <output id="sunValue">0%</output></label><input id="sunset" type="range" min="0" max="100" value="0"><button id="reset">Reset view</button></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/controls/OrbitControls.js';

import {createMobileControls} from './mobile-controls.js';
const panel=document.querySelector('.controls'),panelToggle=document.querySelector('#panelToggle'), host=document.querySelector('#viewport'), portalPrompt=document.querySelector('#portalPrompt'), direction=document.querySelector('#direction'), sunset=document.querySelector('#sunset'), reset=document.querySelector('#reset'), dirValue=document.querySelector('#dirValue'), sunValue=document.querySelector('#sunValue'), scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);camera.position.set(19,15,29);
panelToggle.onclick=()=>{panel.classList.toggle('collapsed');panelToggle.textContent=panel.classList.contains('collapsed')?'＋':'−';panelToggle.setAttribute('aria-label',panel.classList.contains('collapsed')?'Expand lighting controls':'Collapse lighting controls')};const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-1.5,2.5,-2);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=65;
const sky=new THREE.HemisphereLight(0xf5f7ff,0x7b8163,1.4);scene.add(sky);const sun=new THREE.DirectionalLight(0xfff3dd,3.5);sun.position.set(8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.camera.near=.5;sun.shadow.camera.far=60;sun.shadow.bias=-.0003;sun.shadow.normalBias=.045;scene.add(sun);
let house;let interior;let inside=false;let level="ground";const solids={exterior:[[-3.5,3.5,-6.3,.35],[-5.35,-4.3,-5.8,-4.6],[-4.9,-3.8,-1,.1],[3.45,4.1,-1.1,8]],ground:[[-4.7,4.7,-4.7,-4.5],[-4.7,-4.5,-4.7,4.7],[4.5,4.7,-4.7,4.7],[-4.7,4.7,4.7,4.9],[-4.4,-3.2,2.8,4.1],[-4.7,-3.7,-1.7,1.1],[-3.5,-2.4,-1.2,.4],[-3.7,-2.1,.8,1.8],[1.1,4.5,-4.7,-3.8],[1.3,4.1,-3.2,-2.0],[1.7,4.0,-1.5,-.8],[2.1,3.9,-.2,1.0]],upper:[[-4.7,4.7,-4.7,-4.5],[-4.7,-4.5,-4.7,4.7],[4.5,4.7,-4.7,4.7],[-4.7,4.7,4.7,4.9],[-3.9,-1.9,-1.4,.9],[1.2,3.4,-1.4,.9],[1.4,3.8,-4.5,-3.1],[-3.9,-1.6,-4.5,-3.1]]};const canWalk=(x,z)=>x>-11&&x<7&&z>-13&&z<8&&!solids[inside?level:'exterior'].some(([l,r,b,f])=>x>l&&x<r&&z>b&&z<f);const moveWithCollision=(x,z,v)=>{const nx=canWalk(x+v.x,z)?x+v.x:x;return{x:nx,z:canWalk(nx,z+v.z)?z+v.z:z}};let entering=false;let enterTimer=0;const loader=new GLTFLoader();const avatar=createAvatar();scene.add(avatar.root);let following=false;let phase=0;const keys=new Set();let virtualMove={x:0,z:0};const mobile=createMobileControls(scene,avatar,camera,v=>{virtualMove=v;following=true});
const enterInterior=()=>{if(inside||entering)return;entering=true;portalPrompt.textContent='进入室内… / Entering…';document.querySelector('#loading').classList.remove('hidden');document.querySelector('#loading').textContent='ENTERING INTERIOR';loader.load('/models/kirkland-house/interior.glb',g=>{interior=g.scene;house.visible=false;interior.visible=true;scene.add(interior);const ground=interior.getObjectByName('GroundFloor');const upper=interior.getObjectByName('UpperFloor');if(ground)ground.visible=true;if(upper)upper.visible=false;level='ground';avatar.root.position.set(0,.14,3.7);controls.target.set(0,1,-1);camera.position.set(12,10,15);controls.update();inside=true;entering=false;portalPrompt.classList.remove('visible');document.querySelector('#loading').classList.add('hidden')},undefined,()=>{entering=false;portalPrompt.textContent='室内加载失败 / Interior failed';document.querySelector('#loading').textContent='INTERIOR FAILED'});};const switchLevel=()=>{if(!inside||entering)return;entering=true;portalPrompt.textContent=level==='ground'?'上楼… / Going upstairs':'下楼… / Going downstairs';document.querySelector('#loading').classList.remove('hidden');document.querySelector('#loading').textContent=level==='ground'?'GOING UPSTAIRS':'GOING DOWNSTAIRS';setTimeout(()=>{const ground=interior?.getObjectByName('GroundFloor');const upper=interior?.getObjectByName('UpperFloor');level=level==='ground'?'upper':'ground';if(ground)ground.visible=level==='ground';if(upper)upper.visible=level==='upper';avatar.root.position.set(0,.14,level==='upper'?3.2:3.7);controls.target.set(0,1,-1);camera.position.set(12,10,15);controls.update();entering=false;portalPrompt.classList.remove('visible');document.querySelector('#loading').classList.add('hidden')},450)};const exitInterior=()=>{if(!inside||entering||level!=='ground')return;entering=true;portalPrompt.textContent='返回庭院… / Exiting…';document.querySelector('#loading').classList.remove('hidden');document.querySelector('#loading').textContent='RETURNING OUTSIDE';setTimeout(()=>{if(interior)interior.visible=false;house.visible=true;inside=false;avatar.root.position.set(-4,.14,.7);controls.target.set(-1.5,2.5,-2);camera.position.set(19,15,29);controls.update();entering=false;portalPrompt.classList.remove('visible');document.querySelector('#loading').classList.add('hidden')},450)};
loader.load('/models/kirkland-house/house.glb',g=>{house=g.scene;house.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(house);loader.load('/models/kirkland-house/birdhouse.glb',b=>{b.scene.position.set(-4.05,1.15,4);b.scene.scale.setScalar(.75);scene.add(b.scene)});document.querySelector('#loading').classList.add('hidden')},undefined,()=>{document.querySelector('#loading').textContent='HOUSE MODEL FAILED TO LOAD'});
function light(){const d=+direction.value*Math.PI/180,t=+sunset.value/100,e=(55-t*61)*Math.PI/180;sun.position.set(Math.sin(d)*Math.cos(e)*30,Math.sin(e)*30,Math.cos(d)*Math.cos(e)*30);sun.intensity=e<0?0:3.5*Math.min(1,Math.max(0,Math.sin(e))/.25);sun.color.set(0xfff3dd).lerp(new THREE.Color(0xff793c),Math.min(1,t*1.2));sky.intensity=(.22+2.18*(1-t))*.55;scene.background=new THREE.Color(0xe9e9e1).lerp(new THREE.Color(0x303c57),t);dirValue.value=direction.value+'°';sunValue.value=sunset.value+'%'}
const walk=document.querySelector('#walk');renderer.domElement.tabIndex=0;walk.onclick=()=>{following=true;renderer.domElement.focus();controls.target.copy(avatar.root.position).add(new THREE.Vector3(0,.8,0));camera.position.copy(controls.target).add(new THREE.Vector3(2,2,4.8));controls.update()};renderer.domElement.addEventListener('keydown',e=>{if('wasd'.includes(e.key.toLowerCase())){e.preventDefault();keys.add(e.key.toLowerCase())}});const showPortal=()=>{const stair=inside&&!entering&&Math.hypot(avatar.root.position.x+2.4,avatar.root.position.z-3.8)<1.6;const close=inside&&level==='ground'&&!entering&&Math.hypot(avatar.root.position.x,avatar.root.position.z-4.7)<1.6;const outside=!inside&&!entering&&Math.hypot(avatar.root.position.x+3.7,avatar.root.position.z-.6)<2.2;const active=stair||close||outside;portalPrompt.textContent=stair?(level==='ground'?'上楼 · Upstairs':'下楼 · Downstairs'):inside?'返回庭院 · Return outside':'进入房屋 · Enter house';portalPrompt.classList.toggle('visible',active);if(active&&!enterTimer){enterTimer=setTimeout(()=>{enterTimer=0;if(stair)switchLevel();else if(inside)exitInterior();else enterInterior()},700)}if(!active&&enterTimer){clearTimeout(enterTimer);enterTimer=0}};portalPrompt.onclick=()=>{if(stair)switchLevel();else if(inside)exitInterior();else enterInterior()};window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'&&portalPrompt.classList.contains('visible')){e.preventDefault();portalPrompt.click()}});renderer.domElement.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'&&portalPrompt.classList.contains('visible'))portalPrompt.click();if('wasd'.includes(e.key.toLowerCase())){e.preventDefault();keys.add(e.key.toLowerCase())}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
direction.oninput=light;sunset.oninput=light;reset.onclick=()=>{camera.position.set(19,15,29);controls.target.set(-1.5,2.5,-2);controls.update();direction.value=38;sunset.value=0;light()};light();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){if(keys.size||virtualMove.x||virtualMove.z){const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3(-f.z,0,f.x);const v=f.multiplyScalar((keys.has('w')?1:0)-(keys.has('s')?1:0)).addScaledVector(r,(keys.has('d')?1:0)-(keys.has('a')?1:0)).add(new THREE.Vector3(virtualMove.x,0,virtualMove.z));if(v.lengthSq()){v.normalize().multiplyScalar(.055);const old=avatar.root.position.clone();const next=moveWithCollision(old.x,old.z,v);avatar.root.position.x=next.x;avatar.root.position.z=next.z;avatar.root.rotation.y=Math.atan2(v.x,v.z);phase+=.45;avatar.animate(phase,true);if(following){const d=avatar.root.position.clone().sub(old);camera.position.add(d);controls.target.add(d)}}}else avatar.animate(phase,false);showPortal();mobile.tick(.016);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script><script>
setTimeout(()=>{const loading=document.querySelector('#loading');if(!document.querySelector('canvas') && loading){loading.classList.remove('hidden');loading.innerHTML='<div style="text-align:center"><img src="/models/kirkland-house/preview.png" alt="Kirkland house preview" style="display:block;width:min(680px,78vw);max-height:70vh;object-fit:contain;border-radius:18px;margin-bottom:16px"><div style="font:12px monospace;letter-spacing:.12em">WEBGL PREVIEW / USE A BROWSER WITH WEBGL ENABLED FOR 3D</div></div>';loading.style.background='#11151b';}},2500);
</script></body></html>
