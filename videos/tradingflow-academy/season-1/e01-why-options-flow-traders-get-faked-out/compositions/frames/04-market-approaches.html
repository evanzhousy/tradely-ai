 <div data-hf-id="hf-17ew" class="title">Three strong starting points.</div><div data-hf-id="hf-spkt" class="sub">Each solves a real problem. None removes the analyst’s responsibility.</div>
 <div data-hf-id="hf-5cwd" class="cards">
  <div data-hf-id="hf-vn2y" class="card"><div data-hf-id="hf-xndk" class="icon">01</div><h2 data-hf-id="hf-k3x0">Tape-first</h2><div data-hf-id="hf-ja5i" class="strong"><span data-hf-id="hf-p3co" class="label">STRENGTH</span>Surface important trades and filter millions of prints.</div><div data-hf-id="hf-6p3o" class="risk"><span data-hf-id="hf-znye" class="label">MISUSE RISK</span>Chase the loudest print as if size equals intent.</div></div>
  <div data-hf-id="hf-i08u" class="card"><div data-hf-id="hf-wggh" class="icon">02</div><h2 data-hf-id="hf-yjyn">Structure-first</h2><div data-hf-id="hf-hckw" class="strong"><span data-hf-id="hf-ndhs" class="label">STRENGTH</span>Map gamma, open interest, volatility, and key strikes.</div><div data-hf-id="hf-6a5y" class="risk"><span data-hf-id="hf-i68a" class="label">MISUSE RISK</span>Treat a modeled level as deterministic.</div></div>
  <div data-hf-id="hf-iejv" class="card"><div data-hf-id="hf-wuri" class="icon">03</div><h2 data-hf-id="hf-xzs0">Alert-first</h2><div data-hf-id="hf-sfca" class="strong"><span data-hf-id="hf-m6kp" class="label">STRENGTH</span>Compress a huge market into manageable candidates.</div><div data-hf-id="hf-rvvc" class="risk"><span data-hf-id="hf-ikjb" class="label">MISUSE RISK</span>Hide ranked evidence, missing inputs, and data clocks.</div></div>
 </div>
 <div data-hf-id="hf-xyz0" class="note"><b data-hf-id="hf-zto6">Fair comparison:</b> many platforms combine more than one approach.</div>
