      <section data-hf-id="hf-e03-07-station-1" class="station"><div data-hf-id="hf-yr3n" class="station-head"><h2 data-hf-id="hf-ec7c">NVDA · orient the candidate</h2><span data-hf-id="hf-307d" class="tab">OVERVIEW</span></div><p data-hf-id="hf-0rdt">Confirm the session, symbol, relative magnitude, signed direction, breadth, and freshness before opening a more specific analytical surface.</p><div data-hf-id="hf-jdor" class="checks"><div data-hf-id="hf-zsdk" class="check"><b data-hf-id="hf-urib">Relative magnitude</b><span data-hf-id="hf-3pve">NET DEI · 2.6×</span></div><div data-hf-id="hf-melc" class="check"><b data-hf-id="hf-yibe">Session direction</b><span data-hf-id="hf-rxqr">NET DEX · POSITIVE</span></div><div data-hf-id="hf-l7o9" class="check"><b data-hf-id="hf-jzeu">Activity breadth</b><span data-hf-id="hf-68o6">128 TRADES · 43 CONTRACTS</span></div><div data-hf-id="hf-llza" class="check"><b data-hf-id="hf-crb6">Provenance</b><span data-hf-id="hf-2gqb">STRUCTURE + FLOW VISIBLE</span></div></div></section>
      <section data-hf-id="hf-e03-07-station-2" class="station"><div data-hf-id="hf-ckk3" class="station-head"><h2 data-hf-id="hf-abzu">Ask a structural question</h2><span data-hf-id="hf-2h43" class="tab">POSITIONING · CHAIN</span></div><p data-hf-id="hf-pahi">Use open interest and chain context to understand where positioning exists. These views do not convert session flow into a prediction.</p><div data-hf-id="hf-olm3" class="checks"><div data-hf-id="hf-kf27" class="check"><b data-hf-id="hf-hkhs">Expiry distribution</b><span data-hf-id="hf-ueup">WHERE IS OI CONCENTRATED?</span></div><div data-hf-id="hf-ktd8" class="check"><b data-hf-id="hf-el10">Strike context</b><span data-hf-id="hf-y9mw">HOW DOES SPOT RELATE?</span></div><div data-hf-id="hf-jmg5" class="check"><b data-hf-id="hf-0270">Call / put structure</b><span data-hf-id="hf-ma9s">WHAT DOES THE CHAIN SHOW?</span></div><div data-hf-id="hf-k0r6" class="check"><b data-hf-id="hf-5u57">Data clock</b><span data-hf-id="hf-3563">WHICH SNAPSHOT?</span></div></div></section>
      <section data-hf-id="hf-e03-07-station-3" class="station"><div data-hf-id="hf-c692" class="station-head"><h2 data-hf-id="hf-mkgc">Ask a sensitivity question</h2><span data-hf-id="hf-uz12" class="tab">GEX · VOL</span></div><p data-hf-id="hf-txm3">Gamma Exposure and volatility answer their own questions. Keep GEX, implied volatility, and signed tape flow conceptually separate.</p><div data-hf-id="hf-o7b2" class="checks"><div data-hf-id="hf-itu3" class="check"><b data-hf-id="hf-eseh">Gamma context</b><span data-hf-id="hf-4odf">STRUCTURAL EXPOSURE</span></div><div data-hf-id="hf-j854" class="check"><b data-hf-id="hf-h5q1">Volatility context</b><span data-hf-id="hf-e7uc">IV · TERM · SKEW</span></div><div data-hf-id="hf-4cmo" class="check"><b data-hf-id="hf-setq">No forced story</b><span data-hf-id="hf-ox4o">DESCRIPTIVE, NOT CERTAIN</span></div><div data-hf-id="hf-3ybn" class="check"><b data-hf-id="hf-oejs">Contradiction stays</b><span data-hf-id="hf-coto">DO NOT HIDE IT</span></div></div></section>
      <section data-hf-id="hf-e03-07-station-4" class="station"><div data-hf-id="hf-bry1" class="station-head"><h2 data-hf-id="hf-7xc4">End with the next question</h2><span data-hf-id="hf-p08u" class="tab">FLOW · CHAIN</span></div><p data-hf-id="hf-ivro">Deeper session evidence and contract selection come next. Mixed or thin evidence changes the verification path; it does not manufacture a verdict.</p><div data-hf-id="hf-nt01" class="checks"><div data-hf-id="hf-3k0m" class="check"><b data-hf-id="hf-fk98">Coherent?</b><span data-hf-id="hf-dmqx">MAGNITUDE + DIRECTION</span></div><div data-hf-id="hf-35pl" class="check"><b data-hf-id="hf-fdza">Broad enough?</b><span data-hf-id="hf-k1vm">MORE THAN ONE ISOLATED ROW</span></div><div data-hf-id="hf-2rek" class="check"><b data-hf-id="hf-oze2">Fresh enough?</b><span data-hf-id="hf-hpms">FOR THIS QUESTION</span></div><div data-hf-id="hf-2d3j" class="check"><b data-hf-id="hf-1ivm">Next investigation</b><span data-hf-id="hf-g6rp">EXPIRY · STRIKE · MONEYNESS</span></div></div><div data-hf-id="hf-e03-07-callout" class="callout">NO VERDICT · ONE BETTER NEXT QUESTION</div></section>
