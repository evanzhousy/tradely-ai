        [173.159,177.939,"Net DEI is useful for cross-name comparison because it measures the"],

        [187.459,189.019,"Direction lives somewhere else."],

        [194.299,196.819,"Positive means the session leaned bullish by"],

        [202.240,204.079,"Sentiment summarizes that sign."],
        [204.299,208.839,"Net DEX is not dealer inventory, a support or resistance level,"],

        [211.839,217.019,"Use Total Premium, trade count, and traded-contract count as supporting context."],
        [217.339,219.279,"No single column carries the whole thesis."],
        [222.639,223.959,"Open Rank · Symbols."],
        [224.900,226.659,"First, lock the session."],
        [227.400,229.520,"Second, choose one sorter."],
